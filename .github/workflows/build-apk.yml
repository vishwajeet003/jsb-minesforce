name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show uploaded files (for troubleshooting)
        run: ls -la && ls -la www android || true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create Android project if it is missing
        run: |
          if [ ! -f android/gradlew ]; then
            echo "android folder missing or incomplete - generating it"
            rm -rf android
            npx cap add android
          fi

      - name: Copy web app into the Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk JSB-Fleet-Ops.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JSB-Fleet-Ops-APK
          path: JSB-Fleet-Ops.apk
